name: Publish nuget packages

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  NuGetDirectory: ${{ github.workspace}}/nuget

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: pwsh

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
          workloads: android, wasm-tools

      - name: Create nuget packages
        run: |
          Get-ChildItem -Path . -Recurse -Include *.csproj |
            Where-Object { $_.DirectoryName -notmatch 'Tests|iOS' } |
            ForEach-Object { dotnet pack $_.FullName --configuration Release --output ${{ env.NuGetDirectory }} }

      - name: Upload nuget packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-linux
          path: ${{ env.NuGetDirectory }}/*.nupkg

  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
          workloads: ios

      - name: Create nuget packages
        run: |
          Get-ChildItem -Path . -Recurse -Include *.csproj |
            Where-Object { $_.DirectoryName -match 'iOS' } |
            ForEach-Object { dotnet pack $_.FullName --configuration Release --output ${{ env.NuGetDirectory }} }

      - name: Upload nuget packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-macos
          path: ${{ env.NuGetDirectory }}/*.nupkg

  publish:
    needs: [build-linux, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: ${{ env.NuGetDirectory }}
          merge-multiple: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: NuGet login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish NuGet packages
        env:
          NUGET_APIKEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          foreach($file in (Get-ChildItem \"${{ env.NuGetDirectory }}\" -Recurse -Include *.nupkg)) {
              dotnet nuget push $file --api-key $env:NUGET_APIKEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          }","replaceAll":false}